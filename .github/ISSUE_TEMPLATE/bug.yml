name: Bug
description: Something does not work as the docs or the aliases say.
title: "[bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste tokens, passwords or private URLs.** Describe the shape ("an alias with two path parameters on the Docker adapter") or use invented data.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What was done and what was seen, on which adapter and domain.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What was expected
      description: Cite the ADR, glossary term or doc when there is one.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Steps with invented data. Say if it was not reproduced yet.
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Netlify
        - CapRover (Docker image)
        - Cloudflare Workers
        - Local
        - Not known
    validations:
      required: true
  - type: input
    id: time-utc
    attributes:
      label: Approximate time (UTC)
      description: When it happened, when known, like 2026-10-27 14:30 UTC. It narrows the logs.
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Commit, adapter, the alias involved (without secrets), request and response. No private content.
  - type: textarea
    id: suspected-cause
    attributes:
      label: Suspected cause and where to look
      description: Files and hypotheses, marked as hypotheses.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: The failing case becomes a test; say which one.
    validations:
      required: true
  - type: input
    id: blocked-by
    attributes:
      label: Blocked by
      placeholder: none
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This issue has no tokens, passwords or private content.
          required: true
