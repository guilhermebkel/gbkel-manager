name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "patch, minor or major"
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

concurrency:
  group: main-writes
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/gbkel-redirects

permissions:
  contents: read

jobs:
  version:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
      sha: ${{ steps.push.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - id: bump
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          pnpm version "$BUMP" --no-git-tag-version
          version=$(node -p 'require("./package.json").version')
          if git rev-parse -q --verify "refs/tags/v${version}" > /dev/null; then
            echo "v${version} is already released; pick patch, minor or major." >&2
            exit 1
          fi
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
      - id: push
        env:
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "release: ${TAG} [skip ci]"
          git tag -a "$TAG" -m "$TAG"
          git push origin HEAD:main "$TAG"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  github-release:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: gh release create "$TAG" --generate-notes --verify-tag --title "$TAG"

  image:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # Why: the tag v1.2.3 becomes the image tags 1.2.3, 1.2 and latest, so CapRover can follow `latest` or pin a version.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.version.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.version.outputs.tag }}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [version, image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
      - id: image
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: echo "name=${IMAGE}:${TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/caprover-deploy
        with:
          url: ${{ vars.CAPROVER_URL }}
          password: ${{ secrets.CAPROVER_PASSWORD }}
          app: ${{ vars.CAPROVER_APP }}
          image: ${{ steps.image.outputs.name }}
          aliases-url: https://raw.githubusercontent.com/${{ github.repository }}/main/domainAliases.json
          git-sha: ${{ needs.version.outputs.sha }}
