name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Why: the jobs run in parallel and together run everything `pnpm check` runs; CI never uses lint-staged.
jobs:
  typecheck-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Why: ESLint's content cache is keyed by the config, so a rule or config change re-lints every file even on a hit; Oxlint keeps no cache.
      - uses: actions/cache@v4
        with:
          path: .eslintcache
          key: eslint-${{ hashFiles('pnpm-lock.yaml', 'eslint.config.mjs', '.oxlintrc.json', 'tooling/eslint-local-rules.mjs', 'tsconfig.json') }}
      - run: pnpm lint

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm quality

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Why: the image is built but not pushed, so a broken Dockerfile fails the pull request and not the release.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: gbkel-redirects:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start the image and answer a redirect through it
        run: |
          docker run --detach --name redirects --publish 3000:3000 gbkel-redirects:ci
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3000/healthz > /dev/null; then break; fi
            sleep 1
          done
          status=$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: linkedin.guilherr.me' http://127.0.0.1:3000/)
          if [ "$status" != "301" ]; then docker logs redirects; exit 1; fi
